name: Build Windows cycle.exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'desktop/**'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies & build bundled web app
        run: |
          npm install
          npx vite build --base=/
        env:
          VITE_BASE_PATH: /

      - name: Copy built web app into desktop/web-dist
        shell: pwsh
        run: |
          if (Test-Path desktop/web-dist) { Remove-Item -Recurse -Force desktop/web-dist }
          Copy-Item -Recurse -Force dist desktop/web-dist

      - name: Install Electron desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build cycle.exe (Portable & Installer)
        working-directory: desktop
        run: npm run build:exe

      - name: Upload cycle.exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cycle.exe-Windows-Executable
          path: |
            desktop/dist/cycle.exe
            desktop/dist/Cycle.exe-Setup-*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/cycle.exe
            desktop/dist/Cycle.exe-Setup-*.exe
